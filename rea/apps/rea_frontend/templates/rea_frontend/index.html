{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REA — Intonation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'rea_frontend/css/main.css' %}?v=68" />
</head>
<body>
  <header class="app-header">
    <button id="brand" class="brand" title="Back to chapter map">
      <span class="brand-mark"><svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v10a5 5 0 0 0 10 0V2"/><path d="M11 17v7"/><path d="M8 24h6"/></svg></span>
      <span class="brand-text">
        <span class="brand-name">REA</span>
        <span class="brand-sub">Intonation</span>
      </span>
    </button>
    <nav class="app-nav" id="app-nav"></nav>
    <div class="header-right">
      <div class="header-stats" id="header-stats"></div>
      {% include "accounts/_account_chip.html" %}
    </div>
  </header>

  <main id="app">
    <!-- Chapter map (landing) -->
    <section id="view-map" class="view view-map"></section>

    <!-- Chapter session -->
    <section id="view-session" class="view view-session" hidden>
      <div class="session-topbar" id="session-topbar"></div>
      <div class="session-stage">
        <div id="notation" class="notation"></div>
        <div id="countdown-bar" class="countdown-bar" hidden><div class="cd-bar-fill" id="cd-bar-fill"></div></div>
        <div id="legend" class="legend"></div>
      </div>
      <div id="info" class="info"></div>
    </section>

    <!-- Soundcheck (mic + pitch-tracker calibration) -->
    <section id="view-soundcheck" class="view view-soundcheck" hidden></section>
  </main>

  <footer class="app-footer">
    <span id="status">Ready</span>
    <span class="footer-hint" id="footer-hint"></span>
  </footer>

  <script src="{% static 'rea_frontend/vendor/vexflow/vexflow.min.js' %}?v=64"></script>
  <script type="module" src="{% static 'rea_frontend/js/app.js' %}?v=68"></script>
</body>
</html>
